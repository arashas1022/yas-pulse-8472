function diagnose(s,sl){const c=DB.set,L=[],k=sl.m,last=dayK(s,sl.iso);
 if(k.vis>0&&k.conv<c.conv)L.push({key:'conv',title:'Conversion پایین',why:'نرخ تبدیل '+fmt(k.conv)+'٪ (فاکتور یکتا ÷ ورودی) کمتر از حد '+fmt(c.conv)+'٪',action:'تمرکز روی Greeting، Need Discovery و Closing؛ همراهی لیدر در ساعات پرورود',sev:(1-k.conv/c.conv)*100});
 if(k.inv&&k.upt<c.upt)L.push({key:'upt',title:'UPT پایین',why:'UPT '+fmt(k.upt)+' کمتر از حد '+fmt(c.upt),action:'Cross-Selling هدفمند برای محصولات مکمل (کیف پول، کمربند، اکسسوری) در هر فاکتور',sev:(1-k.upt/c.upt)*100});
 const b=atvBench(s,sl);if(b&&k.inv&&k.atv<b.v*.9)L.push({key:'atv',title:'ATV پایین',why:'ATV '+fmt(Math.round(k.atv))+' کمتر از معیار '+fmt(Math.round(b.v)),action:'پیشنهاد ست کامل و آیتم‌های با ارزش بالاتر؛ نمایش مدل‌های پرفروش گران‌تر',sev:(1-k.atv/b.v)*100});
 const fd=[...new Set(DB.ff.filter(x=>mk(x.date)==mk(sl.iso)&&x.date<=sl.iso).map(x=>x.date))];
 if(last.k.vis>0&&fd.length>=3){const af=DB.ff.filter(x=>fd.includes(x.date)).reduce((a,x)=>a+x.v,0)/fd.length;if(last.k.vis<af*.85&&last.t&&last.k.s<last.t)L.push({key:'ff',title:'ورودی پایین',why:'ورودی آخرین روز '+fmt(last.k.vis)+' نسبت به میانگین ماه ('+fmt(af)+') کمتر بوده',action:'ارتباط با مشتریان قبلی و بررسی ویترین و چیدمان برای جذب عبوری',sev:(1-last.k.vis/af)*100})}
 const weak=SL(s).map(e=>{const x=eEx(e,s,sl.day,sl.mo);return{e,r:x>0?EK(e,sl).s/x:null}}).filter(x=>x.r!=null&&x.r<.85);
 if(weak.length)L.push({key:'ind',title:'عملکرد فردی پایین',why:weak.map(x=>x.e.name.split(' ')[0]+' '+pc(x.r)).join('، ')+' نسبت به برنامهٔ فردی',action:'Coaching فردی توسط لیدر: '+weak.map(x=>x.e.name.split(' ')[0]).join('، '),sev:(1-weak.reduce((a,x)=>a+x.r,0)/weak.length)*100});
 if(sl.pace<.9)L.push({key:'pace',title:'عقب‌ماندن از برنامهٔ فروش',why:'تحقق '+pc(sl.pace)+' نسبت به برنامهٔ تارگت تا آخرین روز ثبت‌شده',action:'هدف ساعتی و پیگیری میانهٔ شیفت؛ تمرکز روی مدل‌های پرفروش',sev:(1-sl.pace)*100});
 return L.sort((a,b)=>b.sev-a.sev)}
const briefCard=(s,sl)=>{const y=dayK(s,sl.iso),k=y.k,r=y.t?k.s/y.t:null,iss=diagnose(s,sl),c=DB.set,b=atvBench(s,sl),wh=[];
 if(k.vis>0&&k.conv<c.conv)wh.push('نرخ تبدیل نسبت به عملکرد مورد انتظار پایین بوده است.');
 if(k.inv&&k.upt<c.upt)wh.push('فروش مکمل و Cross-Selling نیاز به Coaching دارد.');
 if(iss.some(x=>x.key=='ff'))wh.push('ورودی پایین عامل محدودکنندهٔ فروش بوده است.');
 if(b&&k.inv&&k.atv<b.v*.9)wh.push('ATV پایین‌تر از معیار بوده است.');
 if(r!=null&&r>=1)wh.push('تارگت آخرین روز ثبت‌شده محقق شده است.');
 return`<div class="card"><h3>DAILY MANAGER BRIEF</h3><div class="sm">بر اساس آخرین روز ثبت‌شده (${pdate(sl.iso)})؛ اطلاعات لحظه‌ای نیست و برای شروع روز کاری بعد است.</div><div class="grid" style="margin-top:8px">${kc('Target',fmt(y.t))}${kc('Actual',fmt(k.s))}${kc('Achievement',r==null?'—':pc(r))}${kc('Footfall',k.vis?fmt(k.vis):'ورودی ثبت نشده')}${kc('Conversion',k.vis?fmt(k.conv)+'٪':'ورودی ثبت نشده')}${kc('UPT / Basket',k.inv?fmt(k.upt):'—')}${kc('ATV',k.inv?fmt(Math.round(k.atv)):'—')}${kc('Unique Invoices',fmt(k.inv))}</div><h4 style="margin:12px 0 6px">WHAT HAPPENED?</h4>${wh.length?wh.map(x=>`<div class="al" style="border-color:var(--y)">${x}</div>`).join(''):'<div class="sm">انحراف مهمی از KPIها دیده نشد ✓</div>'}<h4 style="margin:12px 0 6px">TODAY'S PRIORITIES</h4>${iss.slice(0,3).map((x,i)=>`<div class="row" style="display:block"><b>${i+1}. ${x.title}</b><div class="sm">${x.why}</div><div>${x.action}</div></div>`).join('')||'<div class="sm">اولویت بحرانی وجود ندارد.</div>'}</div>`};
const smartCard=(s,sl)=>{const iss=diagnose(s,sl).slice(0,3),can=ENT();return`<div class="card"><h3>SMART ACTION PLAN</h3><div class="sm">DATA → DIAGNOSIS → PRIORITY → ACTION · بر اساس ${pdate(sl.iso)}</div>${iss.length?iss.map((x,i)=>`<div class="row" style="display:block"><span class="badge ${i?'y':'r'}">Priority ${i+1}</span> <b>${x.title}</b><div class="sm">DATA: ${x.why}</div><div>ACTION: ${x.action}</div>${can?`<button class="ln" style="font-size:13px" data-a="addSmart" data-i="${i}">＋ افزودن به اکشن‌پلن</button>`:''}</div>`).join(''):'<div class="empty">اولویت بحرانی ندارد ✓</div>'}</div>`};
const hdrCard=(s,st)=>{const g=Math.round((new Date(tdy()+'T12:00:00')-new Date(st.iso+'T12:00:00'))/864e5);return`<div class="card" style="padding:12px 14px"><div class="row" style="border:0;padding:0"><div><b style="font-size:16px">${s.name}</b> <span class="sm">Grade ${s.grade}</span><div class="sm">آخرین روز ثبت‌شده: <b>${pdate(st.iso)}</b>${g>0?' · '+fmt(g)+' روز پیش':''}</div></div><span class="sm">داده روزانه ثبت می‌شود</span></div></div>`};
// ---- team intelligence
const ewBadge=x=>['<span class="badge g">🟢 ON TRACK</span>','<span class="badge y">🟡 ATTENTION</span>','<span class="badge r">🔴 ACTION REQUIRED</span>'][x.lvl];
/* EARLY WARNING per person (based on last recorded day, not real-time):
   r = personal actual / personal expected-to-date. low3 = number of the last 3 recorded days with daily achievement < 70%.
   ACTION REQUIRED: r<0.70 or low3==3 ; ATTENTION: r<0.90 or low3>=2 ; else ON TRACK. */
function ewOf(e,s,sl){const x=eEx(e,s,sl.day,sl.mo);if(!(x>0))return{lvl:0,r:null,txt:'تا این روز تارگتی نداشته'};const r=EK(e,sl).s/x,ds=recDays(sl).slice(-3);let low=0,seen=0;ds.forEach(d=>{const q=pd(d),t=eD(e,s,q.d,q.m);if(t>0){seen++;const a=DB.sales.filter(z=>z.emp==e.id&&z.date==d).reduce((n,z)=>n+z.sales,0);if(a/t<.7)low++}});
 const lvl=r<.7||(seen==3&&low==3)?2:r<.9||low>=2?1:0;return{lvl,r,low,seen,txt:'تحقق '+pc(r)+' از برنامهٔ تا اینجا'+(seen?' · '+fmt(low)+' روز از '+fmt(seen)+' روز اخیر زیر ۷۰٪':'')}}
function kpiGaps(e,s,sl){const k=EK(e,sl),kt=K(DB.sales.filter(x=>x.emp!=0&&x.emp&&mk(x.date)==mk(sl.iso)&&x.date<=sl.iso)),G=[],x=eEx(e,s,sl.day,sl.mo);
 if(k.inv&&kt.inv){if(k.upt<kt.upt*.9)G.push(['UPT','UPT '+fmt(k.upt)+' کمتر از میانگین تیم ('+fmt(kt.upt)+')','تمرین پیشنهاد مکمل در هر فروش (کیف پول، کمربند)']);if(k.atv<kt.atv*.9)G.push(['ATV','ATV '+fmt(Math.round(k.atv))+' کمتر از میانگین تیم','پیشنهاد ست کامل و آیتم‌های با ارزش بالاتر'])}
 if(x>0&&k.s/x<.85)G.push(['Achievement','تحقق '+pc(k.s/x)+' از برنامهٔ فردی','تعیین هدف روزانهٔ مشخص و پیگیری لیدر در میانهٔ شیفت']);return G}
function profileHtml(e,s,sl){const k=EK(e,sl),t=eT(e,s,sl.mo),ds=recDays(sl),ser=ds.map(d=>{const q=pd(d),tg=eD(e,s,q.d,q.m),a=DB.sales.filter(x=>x.emp==e.id&&x.date==d).reduce((z,x)=>z+x.sales,0);return{d,tg,a,r:tg>0?a/tg:null}}).filter(x=>x.r!=null),by=ser.slice().sort((a,b)=>b.r-a.r),ew=ewOf(e,s,sl),G=kpiGaps(e,s,sl),W=300,H=54,bw=ser.length?W/ser.length:W;
 return`<div class="sm" style="margin:8px 0">${ewBadge(ew)} ${ew.txt}</div><div class="grid">${kc('Unique Invoices',fmt(k.inv))}${kc('Sales Units',fmt(k.s))}${kc('Sales Value',fmt(Math.round(k.amt)))}${kc('UPT / Basket',k.inv?fmt(k.upt):'—')}${kc('ATV',k.inv?fmt(Math.round(k.atv)):'—')}${kc('Target فردی',fmt(t))}</div>
${ser.length?`<svg viewBox="0 0 ${W} ${H}" style="width:100%;margin-top:8px">${ser.map((x,i)=>`<rect x="${i*bw+2}" y="${H-Math.min(1.5,x.r)/1.5*(H-6)}" width="${bw-4}" height="${Math.min(1.5,x.r)/1.5*(H-6)}" rx="2" fill="${x.r>=1?'var(--g)':x.r>=.7?'var(--y)':'var(--r)'}"/>`).join('')}<line x1="0" x2="${W}" y1="${H-1/1.5*(H-6)}" y2="${H-1/1.5*(H-6)}" stroke="#888" stroke-dasharray="3 3"/></svg><div class="sm">روند روزانهٔ تحقق (خط‌چین = ۱۰۰٪ تارگت روز) · بهترین روز: ${pdate(by[0].d)} (${pc(by[0].r)}) · ضعیف‌ترین روز: ${pdate(by[by.length-1].d)} (${pc(by[by.length-1].r)})</div>`:''}
${G.length?G.map(g=>`<div class="al" style="border-color:var(--y)"><b>KPI ضعیف: ${g[0]}</b> — ${g[1]}<br>Coaching: ${g[2]}</div>`).join(''):'<div class="sm" style="margin-top:6px">KPI ضعیف مشخصی دیده نشد ✓</div>'}`}
const teamSnap=(s,sl)=>{const L=SL(s).map(e=>({e,ew:ewOf(e,s,sl)})),n=[0,1,2].map(i=>L.filter(x=>x.ew.lvl==i).length),P=dayPerf(s,sl.iso),top=P.find(x=>x.a>0);return`<div class="card"><h3>TEAM SNAPSHOT</h3><div class="grid">${kc('🟢 ON TRACK',fmt(n[0]))}${kc('🟡 ATTENTION',fmt(n[1]))}${kc('🔴 ACTION REQUIRED',fmt(n[2]))}${kc('🏆 MVP آخرین روز',top?top.e.name.split(' ')[0]+' '+pc(top.r):'—')}</div>${L.filter(x=>x.ew.lvl>0).map(x=>`<div class="row"><b>${x.e.name}</b><span class="sm">${x.ew.txt}</span></div>`).join('')}</div>`};
